# Validates cross-service configuration consistency across all environments.
# Runs on every PR that touches config files, and on push to dev/master.

name: config-validation

on:
  push:
    branches: [dev, master, staging]
    paths:
      - "backend/config/**"
      - "deploy/compose/**"
      - "deploy/ansible/**"
      - ".github/workflows/config-validation.yml"
  pull_request:
    branches: [dev, master]
    paths:
      - "backend/config/**"
      - "deploy/compose/**"
      - "deploy/ansible/**"

jobs:
  validate:
    name: config consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose files
        run: |
          set -euo pipefail
          # Validate each compose file parses correctly
          # (env vars without defaults will fail if not set, so provide dummies)
          export POSTGRES_PASSWORD=dummy REDIS_PASSWORD=dummy API_KEY=dummy
          export CORS_ORIGINS=http://localhost EMBEDDING_BASE_URL=http://localhost:8002/v1
          export RERANK_BASE_URL=http://localhost:8003/v1
          export FAST_LLM_BASE_URL=http://localhost REASONING_LLM_BASE_URL=http://localhost
          export BACKEND_URL=http://localhost:8000
          export CHAT_LLM_BASE_URL=http://localhost REASONING_LLM_API_KEY=dummy
          export SESSION_SIGNING_KEY=dummy FAST_LLM_API_KEY=dummy CHAT_LLM_API_KEY=dummy
          export TRANSLATION_LLM_BASE_URL=http://localhost TRANSLATION_LLM_API_KEY=dummy

          for f in deploy/compose/*/docker-compose.yml; do
            [[ -f "$f" ]] || continue
            echo "--- Validating $f ---"
            docker compose -f "$f" config --quiet && echo "OK" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Validate Ansible playbooks (syntax check)
        # deploy/ansible/ansible.cfg sets roles_path and inventory relative to
        # itself, so ansible must run from that directory; from the repo root
        # it resolves roles against playbooks/roles and fails with
        # "The role 'common' was not found".
        working-directory: deploy/ansible
        env:
          # ansible.cfg logs to /var/log/ansible, which does not exist on the runner.
          ANSIBLE_LOG_PATH: /tmp/ansible-syntax-check.log
          # ansible.cfg requires deploy/ansible/.vault_pass, which is not
          # committed. Syntax check needs the file to exist, not the real secret:
          # nothing under group_vars/ is vault-encrypted in this repo.
          ANSIBLE_VAULT_PASSWORD_FILE: /tmp/ansible-vault-pass
        run: |
          set -euo pipefail
          printf 'ci-syntax-check\n' > /tmp/ansible-vault-pass
          pip install ansible-core --quiet
          ansible-galaxy collection install -r requirements.yml --force
          for inv in inventories/*/hosts.yml; do
            env=$(basename "$(dirname "$inv")")
            echo "--- Checking $env inventory ---"
            ansible-playbook --syntax-check playbooks/site.yml -i "$inv" \
              || { echo "FAIL: $env"; exit 1; }
          done

      - name: Check environment config completeness
        run: |
          set -euo pipefail
          # Verify all three environment configs exist
          for env in development staging production; do
            f="backend/config/environments/${env}.yaml"
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing environment config: $f"
              exit 1
            fi
            echo "Found: $f"
          done

          # Verify vault examples exist for all environments
          for env in development staging production; do
            f="backend/config/vault/${env}.yaml.example"
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing vault example: $f"
              exit 1
            fi
            echo "Found: $f"
          done

          echo "All environment configs present."

      - name: Check model name consistency
        run: |
          set -euo pipefail
          # The canonical rerank model must be BAAI/bge-reranker-v2-m3 everywhere.
          # This file is excluded: it holds the pattern and the message, so it
          # always matched itself.
          STALE=$(git grep -rn 'Qwen/Qwen3-Reranker' -- '*.yaml' '*.yml' '*.py' \
            ':!.github/workflows/config-validation.yml' || true)
          if [[ -n "$STALE" ]]; then
            echo "::error::Stale rerank model name 'Qwen/Qwen3-Reranker' found:"
            echo "$STALE"
            exit 1
          fi
          echo "Model names consistent."
