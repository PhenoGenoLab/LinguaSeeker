# Fails when a change introduces a hardcoded secret literal.
# Scans only the lines added by the push/PR, so existing test fixtures and
# placeholder strings never need re-baselining. Implementation:
# scripts/check_hardcoded_secrets.sh

name: secret-scan

on:
  push:
    branches: [dev, master, staging]
  pull_request:
    branches: [dev, master]

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history + all refs: the scan diffs against the PR base or the
      # pushed-from commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan added lines for hardcoded secrets
        run: bash scripts/check_hardcoded_secrets.sh
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
