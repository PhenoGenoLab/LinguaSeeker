# CI: lint, type-check, and test for backend + frontend.
#
# Runs on every PR and push to dev / master / staging.

name: ci

on:
  push:
    branches: [dev, master, staging]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: backend lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"

      - name: Ruff check
        env:
          UV_INDEX_URL: https://pypi.org/simple/
        run: uvx --from ruff==0.15.17 ruff check --config pyproject.toml

      - name: Collect changed Python files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          base=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD origin/dev 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [[ -z "$base" ]]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only --diff-filter=ACMRT "$base"...HEAD -- 'backend/*.py' \
            | sed 's#^backend/##' \
            | tr '\n' ' ')"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # Repo-wide formatting is not yet clean; gate only the files this change
      # touches so pre-existing drift cannot block unrelated PRs.
      - name: Ruff format check (changed files)
        if: steps.changed.outputs.files != ''
        env:
          UV_INDEX_URL: https://pypi.org/simple/
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: uvx --from ruff==0.15.17 ruff format --check --config pyproject.toml $CHANGED_FILES

  backend-typecheck:
    name: backend type-check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"

      - name: Mypy (source fact chain)
        env:
          UV_INDEX_URL: https://pypi.org/simple/
        run: >-
          uvx --from mypy==2.4.1 mypy
          --ignore-missing-imports
          --follow-imports=silent
          src/core/tools/fact_chain
          src/pipeline/skills/fact_chain
          src/pipeline/skills/runtime
          src/pipeline/graph/phases/phase_3.py
          src/agents/contracts.py

  backend-test:
    name: backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          cache-dependency-glob: "backend/uv.lock"

      # The `ci` dependency group is the minimal import chain for these tests.
      # It deliberately excludes torch/NVIDIA wheels and the Rust extension so
      # a pure-Python suite cannot fail on GPU downloads or maturin builds.
      # Exporting the frozen lock keeps versions pinned while allowing PyPI as
      # the download source instead of the mirror recorded in uv.lock.
      - name: Export locked CI requirements
        run: >-
          uv export --frozen --only-group ci --no-emit-project
          --format requirements-txt -o /tmp/ci-requirements.txt

      - name: Install CI test dependencies
        env:
          UV_INDEX_URL: https://pypi.org/simple/
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python \
            --index-url https://pypi.org/simple/ \
            -r /tmp/ci-requirements.txt

      - name: Run deterministic unit suite
        run: >-
          .venv/bin/python -m pytest
          tests/core/source_fact_chain
          tests/agents
          tests/pipeline
          tests/api/test_wiring_config.py
          tests/core/visualize_evidence_with_expert_in_loop/test_search_service.py
          -q
          --cov=src.core.tools.fact_chain
          --cov=src.pipeline.skills.fact_chain
          --cov=src.pipeline.skills.runtime
          --cov=src.pipeline.graph.phases.phase_3
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=85

      # Kept in its own process: the agents suite installs global dependency
      # mocks that leak into this module when both run in one interpreter.
      - name: Run pipeline API tests (isolated process)
        run: .venv/bin/python -m pytest tests/api/test_pipeline_api.py -q

  frontend-checks:
    name: frontend lint + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: TypeScript type-check
        run: bun run type-check

  frontend-test:
    name: frontend test (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  rust-test:
    name: rust test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: [rust-io, files-io, net-io]
    defaults:
      run:
        working-directory: backend/libs/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libssl-dev pkg-config

      - name: cargo test
        run: cargo test
