# CI: lint, type-check, and test for backend + frontend.
#
# Runs on every PR and push to dev / master / staging.

name: ci

on:
  push:
    branches: [dev, master, staging]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: backend lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"

      - name: Ruff check
        env:
          UV_INDEX_URL: https://pypi.org/simple/
        run: uvx --from ruff==0.15.17 ruff check --config pyproject.toml

      - name: Collect changed Python files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          base=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD origin/dev 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [[ -z "$base" ]]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only --diff-filter=ACMRT "$base"...HEAD -- 'backend/*.py' \
            | sed 's#^backend/##' \
            | tr '\n' ' ')"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # Repo-wide formatting is not yet clean; gate only the files this change
      # touches so pre-existing drift cannot block unrelated PRs.
      - name: Ruff format check (changed files)
        if: steps.changed.outputs.files != ''
        env:
          UV_INDEX_URL: https://pypi.org/simple/
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: uvx --from ruff==0.15.17 ruff format --check --config pyproject.toml $CHANGED_FILES

  backend-typecheck:
    name: backend type-check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"

      # Scope note: the extraction/translation implementation now lives in
      # skills/ and carries 23 pre-existing type errors that were never checked
      # (they moved here from the old graph/agents tree). Listed in
      # docs/active/2026-11-22-agents-portal-split-spec.md as a follow-up; this
      # step keeps the coverage the project had before the split.
      - name: Mypy (source fact chain + agent portals)
        env:
          UV_INDEX_URL: https://pypi.org/simple/
        run: >-
          uvx --from mypy==2.4.1 mypy
          --ignore-missing-imports
          --follow-imports=silent
          src/core/shared/tools/fact_chain
          src/pipeline/skills/runtime
          src/pipeline/skills/extraction/service.py
          src/pipeline/skills/extraction/extract.py
          src/pipeline/skills/extraction/runner.py
          src/pipeline/skills/extraction/prompts
          src/pipeline/skills/translation/stage.py
          src/pipeline/skills/translation/prompts.py
          src/pipeline/graph/phases/fact_chain.py
          src/runs/contracts.py

  backend-test:
    name: backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          cache-dependency-glob: "backend/uv.lock"

      # The `ci` dependency group is the minimal import chain for these tests.
      # It deliberately excludes torch/NVIDIA wheels and the rust-io wheel so a
      # pure-Python suite cannot fail on GPU downloads or platform-specific wheels.
      # Exporting the frozen lock keeps versions pinned while allowing PyPI as
      # the download source instead of the mirror recorded in uv.lock.
      - name: Export locked CI requirements
        run: >-
          uv export --frozen --only-group ci --no-emit-project
          --format requirements-txt -o /tmp/ci-requirements.txt

      - name: Install CI test dependencies
        env:
          UV_INDEX_URL: https://pypi.org/simple/
        run: |
          uv venv --python 3.12 .venv
          # The lock pins the CN mirror for some packages; GitHub runners get a
          # 403 from it. Its /packages/<hash>/ paths are identical to PyPI's
          # files host, so rewrite the host and keep the pinned hashes.
          sed -i 's|https://pypi.tuna.tsinghua.edu.cn/packages/|https://files.pythonhosted.org/packages/|g' \
            /tmp/ci-requirements.txt
          uv pip install --python .venv/bin/python \
            --index-url https://pypi.org/simple/ \
            -r /tmp/ci-requirements.txt

      # Coverage scope: the deterministic suite exercises these modules. The
      # extraction/translation implementation moved into the same directories,
      # so the old dir-wide targets would now measure thousands of lines this
      # suite never runs; those are covered by their own (non-CI) test suites.
      - name: Run deterministic unit suite
        run: >-
          .venv/bin/python -m pytest
          tests/core/source_fact_chain
          tests/runs
          tests/pipeline
          tests/api/test_wiring_config.py
          tests/api/test_v2_contracts.py
          tests/pipeline/test_search_service.py
          -q
          --cov=src.core.shared.tools.fact_chain
          --cov=src.pipeline.skills.runtime
          --cov=src.pipeline.skills.extraction.service
          --cov=src.pipeline.skills.extraction.extract
          --cov=src.pipeline.skills.extraction.runner
          --cov=src.pipeline.skills.translation.stage
          --cov=src.pipeline.graph.phases.fact_chain
          --cov=src.runs.contracts
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=85

      # Kept in its own process: the agents suite installs global dependency
      # mocks that leak into this module when both run in one interpreter.
      - name: Run pipeline API tests (isolated process)
        run: .venv/bin/python -m pytest tests/api/test_pipeline_api.py -q

  frontend-checks:
    name: frontend lint + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: TypeScript type-check
        run: bun run type-check

  frontend-test:
    name: frontend test (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
