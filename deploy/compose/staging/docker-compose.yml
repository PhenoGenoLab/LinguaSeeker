# ============================================================================
# Staging — FastAPI only. Postgres, Redis, and Neo4j are external containers.
# ============================================================================
# Mirrors production structure for pre-release validation.
#
# From the repo root:
#   docker compose -f deploy/compose/staging/docker-compose.yml \
#                  --env-file deploy/compose/staging/.env \
#                  pull
#   docker compose -f deploy/compose/staging/docker-compose.yml \
#                  --env-file deploy/compose/staging/.env \
#                  up -d
#
# Required env vars (set in .env or export):
#   POSTGRES_HOST, POSTGRES_PASSWORD, REDIS_HOST, NEO4J_URI, NEO4J_PASSWORD,
#   API_KEY, CORS_ORIGINS, EMBEDDING_BASE_URL, RERANK_BASE_URL,
#   FAST_LLM_BASE_URL, REASONING_LLM_BASE_URL
#
# ── Volume ownership ────────────────────────────────────────────────
# The image runs as non-root uid 1000 (deploy). Fresh named volumes
# inherit deploy ownership from the image's /app/data, /app/downloads,
# /app/output, /app/logs (fixed in the Dockerfile). Volumes created by an
# older image are root-owned and break Phase 1 with "[Errno 13] Permission
# denied: /app/data/pipeline". Remediate once:
#   docker compose -f deploy/compose/staging/docker-compose.yml \
#     --env-file deploy/compose/staging/.env \
#     exec -u root backend chown -R deploy:deploy /app/data /app/downloads /app/output
# ============================================================================
services:
  backend:
    image: ${BACKEND_IMAGE:-docker.io/lanshi47/lingua-seeker-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: staging
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_KEY: ${API_KEY}
      # -- Database (staging) --
      # All database services are external containers.
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must point to the external database container}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: staging_lingua_seeker
      POSTGRES_USER: lingua_seeker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SCHEMA: lingua_seeker
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must point to the external Redis container}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      # -- Neo4j (external container) --
      NEO4J_URI: ${NEO4J_URI:?NEO4J_URI must point to the external Neo4j container}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      # -- Inference / LLM endpoints (point at GPU host) --
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_API_STYLE: ${EMBEDDING_API_STYLE:-openai}
      RERANK_BASE_URL: ${RERANK_BASE_URL}
      RERANK_API_STYLE: ${RERANK_API_STYLE:-openai}
      FAST_LLM_BASE_URL: ${FAST_LLM_BASE_URL}
      REASONING_LLM_BASE_URL: ${REASONING_LLM_BASE_URL}
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - backend_downloads:/app/downloads
      - backend_output:/app/output
      - ./config/staging.yaml:/app/config/environments/staging.yaml:ro
      - ./config/vault/staging.yaml:/app/config/vault/staging.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  backend_logs:
  backend_data:
  backend_downloads:
  backend_output:
